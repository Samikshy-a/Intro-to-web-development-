<!doctype html>
<html lang="eng">
  <head>
    <meta dataset="UTF-8" />
    <title>Day 2-HTML FUndamental</title>
  </head>
  <body>
    <main>
      <!-- Heading and Paragraph -->
      <section>
        <h1>This is Heading 1</h1>
        <h2>this is heading 2</h2>
        <h3>this is heading 3</h3>
        <h4>this is heading 4</h4>
        <h5>this is heading 5</h5>
        <h6>this is heading 6</h6>
        <p>this is paragraph</p>

        <br />
        <br />
        <!-- Lists -->
        <ol>
          <li>This</li>
          <li>is</li>
          <li>list</li>
        </ol>
        <br />
        <ul>
          <li>dog</li>
          <li>cat</li>
          <li>bird</li>
        </ul>

        <br />

        <dl>
          <dt>HTML</dt>
          <dd>Hypertext marking language</dd>

          <dt>CSS</dt>
          <dd>Cascasing Style Sheet</dd>

          <dt>JS</dt>
          <dd>JavaScript</dd>
        </dl>
      </section>

      <section>
        <!-- Images -->
        <a href="https://github.com/Samikshy-a" target="blank"
          >This is a link
        </a>
        <br />
        <br />

        <img src="public/images/girl.png" alt="Girl" />
      </section>

      <br>

      <section>
        <!-- Form -->
        <form>
          <input type="text" required/>
          <button>Submit</button>
        </form>
      </section>
    </main>
  </body>
</html>
