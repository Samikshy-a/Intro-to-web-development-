<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Day 4 - Layout and Responsive Design</title>
    <link rel="stylesheet" href="index.css">
    <!-- Inline , inline block and block -->
  </head>
  <body>
    <main>
      <h1>What is layout</h1>
      <section>
        <div>
          <span style="background-color: lavenderblush">
            This is a inline default</span
          >
          <span style="display: block; background-color: rgb(197, 106, 153)">
            This is block
          </span>
          <span style="display: inline-block; background-color: darksalmon"
            >This is inline block
          </span>
          <span
            style="
              display: inline-block;
              background-color: darkseagreen;
              width: 200px;
              height: 100px;
            "
            >This is inline block</span
          >
        </div>
      </section>
      <!-- Flexbox -->
       <section class="container">
        <div class="box"><</div>
        <div class="box"><</div>
        <div class="box"><</div>
        <div class="box"><</div>
       </section>
    </main>
  </body>
</html>
